<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANIX Workshop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
    }
    .section {
      display: none;
    }
    .section.active {
      display: block;
    }
    .artist-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .artist-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .artist-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .artist-info h3 {
      margin: 0;
      font-size: 1.1rem;
    }
    .artist-price {
      color: var(--accent);
      font-weight: bold;
      font-size: 0.9rem;
    }
    .specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .portfolio-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    input, textarea {
      background: var(--bg-color);
      border: 1px solid #334155;
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
    }
    button.submit-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.delete-btn {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('artists', this)">🎨 Артисты</button>
    <button class="tab-btn" onclick="switchTab('apply', this)">📝 Стать мастером</button>
    <button id="admin-tab-btn" class="tab-btn" style="display: none;" onclick="switchTab('admin', this)">👑 Админка</button>
  </div>

  <!-- СЕКЦИЯ: СПИСОК АРТИСТОВ -->
  <div id="artists" class="section active">
    <h2>Мастера VANIX Workshop</h2>
    <div id="artists-container">Загрузка мастеров...</div>
  </div>

  <!-- СЕКЦИЯ: ФОРМА ЗАЯВКИ -->
  <div id="apply" class="section">
    <h2>Заявка на вступление</h2>
    <form id="appForm">
      <input type="text" id="name" placeholder="Ваш никнейм" required>
      <input type="text" id="price" placeholder="Средняя цена (напр. от 500₽)" required>
      <input type="url" id="portfolio" placeholder="Ссылка на портфолио" required>
      <input type="text" id="specs" placeholder="Специализации (через запятую)" required>
      <textarea id="desc" rows="3" placeholder="Описание ваших услуг" required></textarea>
      <button type="submit" class="submit-btn">Отправить заявку</button>
    </form>
  </div>

  <!-- СЕКЦИЯ: АДМИН-ПАНЕЛЬ -->
  <div id="admin" class="section">
    <h2>👑 Панель Администратора</h2>

    <form id="adminAddForm">
      <h3 style="margin: 0; text-align: center;">➕ Добавить артиста</h3>
      <input type="text" id="adm-name" placeholder="Никнейм артиста" required>
      <input type="text" id="adm-price" placeholder="Средняя цена (напр. от 500₽)" required>
      <input type="url" id="adm-portfolio" placeholder="Ссылка на портфолио" required>
      <input type="text" id="adm-specs" placeholder="Специализации (через запятую)" required>
      <textarea id="adm-desc" rows="3" placeholder="Описание услуг" required></textarea>
      <button type="submit" class="submit-btn">Добавить в базу</button>
    </form>

    <h3 style="text-align: center; margin-top: 24px;">🗑️ Удаление артистов</h3>
    <div id="admin-artists-container">Загрузка мастеров...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const ADMIN_ID = 6955345877; // Твой Telegram ID
    const userId = tg.initDataUnsafe?.user?.id;

    // Включаем вкладку "Админка" только для администратора
    if (userId === ADMIN_ID) {
      document.getElementById('admin-tab-btn').style.display = 'inline-block';
    }

    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      if (btnElement) {
        btnElement.classList.add('active');
      }

      if (tabName === 'admin') {
        loadAdminArtists();
      }
    }

    // Загрузка артистов для основной страницы
    async function loadArtists() {
      const container = document.getElementById('artists-container');
      try {
        const response = await fetch('artists.json?cache=' + Date.now());
        if (!response.ok) throw new Error("Файл не найден");
        const artists = await response.json();

        if (artists.length === 0) {
          container.innerHTML = "<p style='text-align:center;'>Список мастеров пока пуст.</p>";
          return;
        }

        container.innerHTML = artists.map(a => `
          <div class="artist-card">
            <div class="artist-header">
              <img class="artist-avatar" src="${a.avatar || 'https://via.placeholder.com/60'}" alt="Avatar">
              <div class="artist-info">
                <h3>${a.name}</h3>
                <div class="artist-price">${a.price}</div>
              </div>
            </div>
            <div class="specs">
              ${(a.specs || []).map(s => `<span class="badge">${s}</span>`).join('')}
            </div>
            <p style="margin: 8px 0; font-size: 0.9rem;">${a.desc}</p>
            <a href="${a.portfolio}" target="_blank" class="portfolio-link">📁 Открыть портфолио</a>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = "<p style='text-align:center;'>Не удалось загрузить список мастеров.</p>";
      }
    }

    // Загрузка артистов в админку с кнопкой удаления
    async function loadAdminArtists() {
      const container = document.getElementById('admin-artists-container');
      try {
        const response = await fetch('artists.json?cache=' + Date.now());
        const artists = await response.json();

        if (artists.length === 0) {
          container.innerHTML = "<p style='text-align:center;'>Список мастеров пуст.</p>";
          return;
        }

        container.innerHTML = artists.map((a, index) => `
          <div class="artist-card">
            <div class="artist-header">
              <img class="artist-avatar" src="${a.avatar || 'https://via.placeholder.com/60'}" alt="Avatar">
              <div class="artist-info">
                <h3>${a.name}</h3>
                <div class="artist-price">${a.price}</div>
              </div>
            </div>
            <button class="delete-btn" onclick="deleteArtist(${index}, '${a.name}')">❌ Удалить мастера</button>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = "<p style='text-align:center;'>Ошибка загрузки списка.</p>";
      }
    }

    // Удаление артиста (отправляет команду боту)
    function deleteArtist(index, name) {
      if (confirm(`Удалить артиста ${name}?`)) {
        tg.sendData(JSON.stringify({
          action: 'admin_delete_artist',
          index: index,
          name: name
        }));
        tg.close();
      }
    }

    // Добавление артиста вручную через админку
    document.getElementById('adminAddForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payload = {
        action: 'admin_add_artist',
        name: document.getElementById('adm-name').value,
        price: document.getElementById('adm-price').value,
        portfolio: document.getElementById('adm-portfolio').value,
        specs: document.getElementById('adm-specs').value.split(',').map(s => s.trim()),
        desc: document.getElementById('adm-desc').value,
        avatar: 'https://via.placeholder.com/60'
      };

      tg.sendData(JSON.stringify(payload));
      tg.close();
    });

    // Обычная заявка пользователя
    document.getElementById('appForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payload = {
        type: 'artist_application',
        name: document.getElementById('name').value,
        price: document.getElementById('price').value,
        portfolio: document.getElementById('portfolio').value,
        specs: document.getElementById('specs').value.split(',').map(s => s.trim()),
        desc: document.getElementById('desc').value,
        avatar: 'https://via.placeholder.com/60'
      };

      tg.sendData(JSON.stringify(payload));
      tg.close();
    });

    loadArtists();
  </script>
</body>
</html>
