<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Куриный Магазин — Виртуальные курицы</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fff8e7;
    color: #3a2e1f;
  }
  header {
    background: #ffb703;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 26px; }
  #cart-btn {
    background: #3a2e1f;
    color: #ffb703;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
  }
  #cart-btn:hover { background: #5a4a33; }

  .hero {
    text-align: center;
    padding: 40px 20px 10px;
  }
  .hero p { color: #7a6a55; margin-top: 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 24px;
    padding: 30px 40px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    transition: transform .2s;
  }
  .card:hover { transform: translateY(-5px); }
  .card .emoji { font-size: 64px; display: block; margin-bottom: 10px; }
  .card h3 { font-size: 18px; margin-bottom: 6px; }
  .card .desc { font-size: 13px; color: #8a7a65; margin-bottom: 12px; min-height: 36px; }
  .card .price { font-size: 20px; font-weight: bold; color: #e07b00; margin-bottom: 12px; }
  .card button {
    background: #ffb703;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    font-size: 15px;
  }
  .card button:hover { background: #ffa000; }

  /* Корзина */
  #cart-panel {
    position: fixed;
    top: 0; right: -400px;
    width: 360px; max-width: 90vw;
    height: 100%;
    background: #fff;
    box-shadow: -4px 0 20px rgba(0,0,0,.15);
    transition: right .3s;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }
  #cart-panel.open { right: 0; }
  #cart-panel h2 { padding: 20px; background: #ffb703; }
  #cart-items { flex: 1; overflow-y: auto; padding: 16px; }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .cart-item button {
    background: none; border: none;
    color: #d33; cursor: pointer; font-size: 16px;
  }
  #cart-footer {
    padding: 16px 20px 24px;
    border-top: 1px solid #eee;
  }
  #cart-total { font-weight: bold; font-size: 18px; margin-bottom: 12px; }
  #checkout-btn {
    width: 100%;
    padding: 14px;
    background: #2e7d32;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #checkout-btn:hover { background: #256428; }
  #close-cart {
    background: none; border: none;
    font-size: 22px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    display: none; z-index: 15;
  }
  #overlay.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>🐔 Куриный Магазин</h1>
  <button id="cart-btn">Корзина (<span id="cart-count">0</span>)</button>
</header>

<section class="hero">
  <h2>Виртуальные курицы на любой вкус</h2>
  <p>Выбери свою курицу — она станет верным питомцем в твоём аккаунте!</p>
</section>

<main class="grid" id="products"></main>

<div id="overlay"></div>

<aside id="cart-panel">
  <h2 style="display:flex;justify-content:space-between;align-items:center;">
    Корзина <button id="close-cart">✕</button>
  </h2>
  <div id="cart-items"><p style="color:#999;">Пока пусто…</p></div>
  <div id="cart-footer">
    <div id="cart-total">Итого: 0 ₽</div>
    <button id="checkout-btn">Оформить заказ</button>
  </div>
</aside>
