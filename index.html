<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANIX WorkShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #151f32;
      --input-bg: #0f172a;
      --accent: #38bdf8;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: #1e293b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
    }
    .header-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    /* Верхнее меню переключения */
    .top-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .nav-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .nav-btn.active {
      background: var(--accent);
      color: #000000;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Карточки мастеров */
    .artist-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .artist-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1e293b;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .artist-title h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .artist-price {
      color: var(--accent);
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      background: #0f172a;
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .artist-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn-action {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      text-decoration: none;
      margin-bottom: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-portfolio {
      background: #1e293b;
      color: var(--text);
    }
    .btn-order {
      background: var(--accent);
      color: #000;
    }
    .btn-delete {
      background: var(--danger);
      color: #fff;
    }

    /* Форма заявки */
    .form-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .form-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input, textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-muted);
    }
    .btn-submit {
      background: var(--accent);
      color: #000;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="header-title">VANIX WorkShop</div>

  <!-- Верхние кнопки переключения -->
  <div class="top-nav">
    <button class="nav-btn active" onclick="switchTab('artists', this)">🎨 Артисты</button>
    <button class="nav-btn" onclick="switchTab('apply', this)">📝 Стать мастером</button>
    <button id="admin-tab-btn" class="nav-btn" style="display:none;" onclick="switchTab('admin', this)">👑 Админ</button>
  </div>

  <!-- Вкладка: Артисты -->
  <div id="tab-artists" class="tab-content active">
    <div id="artists-container">Загрузка мастеров...</div>
  </div>

  <!-- Вкладка: Заявка на вступление -->
  <div id="tab-apply" class="tab-content">
    <div class="form-box">
      <div class="form-title">Заявка на вступление</div>
      <form id="appForm">
        <input type="text" id="name" placeholder="Ваш никнейм" required>
        <input type="text" id="price" placeholder="Средняя цена (напр. от 500₽)" required>
        <input type="url" id="portfolio" placeholder="Ссылка на портфолио" required>
        <input type="text" id="specs" placeholder="Специализации (через запятую)" required>
        <textarea id="desc" rows="3" placeholder="Описание ваших услуг" required></textarea>
        <button type="submit" class="btn-submit">Отправить заявку</button>
      </form>
    </div>
  </div>

  <!-- Вкладка: Админ панель -->
  <div id="tab-admin" class="tab-content">
    <div class="form-box" style="margin-bottom: 20px;">
      <div class="form-title">➕ Добавить мастера вручную</div>
      <form id="adminAddForm">
        <input type="text" id="adm-name" placeholder="Никнейм мастера" required>
        <input type="text" id="adm-price" placeholder="Средняя цена (напр. от 500₽)" required>
        <input type="url" id="adm-portfolio" placeholder="Ссылка на портфолио" required>
        <input type="text" id="adm-specs" placeholder="Специализации (через запятую)" required>
        <textarea id="adm-desc" rows="3" placeholder="Описание услуг" required></textarea>
        <button type="submit" class="btn-submit">Добавить в базу</button>
      </form>
    </div>

    <div class="form-title" style="margin-bottom:12px;">Управление мастерами:</div>
    <div id="admin-artists-list">Загрузка...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const ADMIN_ID = 6955345877;
    const userId = tg.initDataUnsafe?.user?.id;

    // Показываем кнопку "Админ" только для тебя
    if (userId === ADMIN_ID) {
      document.getElementById('admin-tab-btn').style.display = 'flex';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById('tab-' + tabId).classList.add('active');
      if (btn) btn.classList.add('active');

      if (tabId === 'admin') {
        loadAdminArtists();
      }
    }

    async function loadArtists() {
      const container = document.getElementById('artists-container');
      try {
        const res = await fetch('artists.json?cache=' + Date.now());
        if (!res.ok) throw new Error();
        const artists = await res.json();

        if (artists.length === 0) {
          container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Список мастеров пуст.</p>";
          return;
        }

        container.innerHTML = artists.map(a => {
          const letter = a.name ? a.name.charAt(0).toUpperCase() : 'M';
          return `
            <div class="artist-card">
              <div class="artist-top">
                <div class="avatar-circle">${letter}</div>
                <div class="artist-title">
                  <h3>${a.name}</h3>
                  <div class="artist-price">${a.price}</div>
                </div>
              </div>
              <div class="tags">
                ${(a.specs || []).map(s => `<span class="tag">${s}</span>`).join('')}
              </div>
              <div class="artist-desc">${a.desc}</div>
              <a href="${a.portfolio}" target="_blank" class="btn-action btn-portfolio">📁 Портфолио</a>
              <button onclick="orderArtist('${a.name}')" class="btn-action btn-order">Заказать</button>
            </div>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Не удалось загрузить мастеров.</p>";
      }
    }

    async function loadAdminArtists() {
      const container = document.getElementById('admin-artists-list');
      try {
        const res = await fetch('artists.json?cache=' + Date.now());
        const artists = await res.json();

        if (artists.length === 0) {
          container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Список мастеров пуст.</p>";
          return;
        }

        container.innerHTML = artists.map((a, idx) => `
          <div class="artist-card">
            <div class="artist-top">
              <div class="artist-title">
                <h3>${a.name}</h3>
                <div class="artist-price">${a.price}</div>
              </div>
            </div>
            <button onclick="deleteArtist(${idx}, '${a.name}')" class="btn-action btn-delete">❌ Удалить мастера</button>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = "<p style='color:var(--text-muted);'>Ошибка загрузки.</p>";
      }
    }

    function deleteArtist(index, name) {
      if (confirm(`Удалить мастера ${name}?`)) {
        tg.sendData(JSON.stringify({
          action: 'admin_delete_artist',
          index: index,
          name: name
        }));
        tg.close();
      }
    }

    document.getElementById('adminAddForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = {
        action: 'admin_add_artist',
        name: document.getElementById('adm-name').value,
        price: document.getElementById('adm-price').value,
        portfolio: document.getElementById('adm-portfolio').value,
        specs: document.getElementById('adm-specs').value.split(',').map(s => s.trim()),
        desc: document.getElementById('adm-desc').value
      };
      tg.sendData(JSON.stringify(payload));
      tg.close();
    });

    document.getElementById('appForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = {
        type: 'artist_application',
        name: document.getElementById('name').value,
        price: document.getElementById('price').value,
        portfolio: document.getElementById('portfolio').value,
        specs: document.getElementById('specs').value.split(',').map(s => s.trim()),
        desc: document.getElementById('desc').value
      };
      tg.sendData(JSON.stringify(payload));
      tg.close();
    });

    function orderArtist(name) {
      tg.sendData(JSON.stringify({ type: 'order', artist: name }));
      tg.close();
    }

    loadArtists();
  </script>
</body>
</html>
